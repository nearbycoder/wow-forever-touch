<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Forever Touch preview</title>
<!--
  Renders README previews of the Forever Touch HUD. Control positions and sizes
  come from layout.js, which tools/preview/export_layout.lua generates by running
  the real addon code in the mock client. The game world is a stand-in drawing.
  Usage: preview.html?scene=hud-cover|hud-main|hud-left|menu|picker|edit|setup|demo&t=<seconds>
-->
<style>
  :root {
    --accent: #db2777; --accent-dark: #7a1543; --accent-soft: #f273ad;
    --panel: rgba(15, 18, 25, 0.95); --panel-light: #21242f; --line: rgba(255,255,255,0.10);
    --text: #f2f2f7; --muted: #a8adbf; --gold: #ffd140;
  }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  body { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--text); }
  #screen { position: relative; overflow: hidden; }
  .abs { position: absolute; }

  /* stand-in world */
  .world { position: absolute; inset: 0; }

  /* round button, mirrors Widgets.lua DecorateRound */
  .rb { position: absolute; border-radius: 50%; }
  .rb .shadow { position: absolute; inset: -18%; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,0,0,0.55) 30%, rgba(0,0,0,0) 70%); transform: translateY(5%); }
  .rb .plate { position: absolute; inset: 0; border-radius: 50%; background: rgba(20,23,31,0.92); }
  .rb .icon { position: absolute; inset: 7%; border-radius: 50%; overflow: hidden; }
  .rb .icon svg { width: 100%; height: 100%; display: block; }
  .rb .rim { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 calc(var(--s) * 0.075) rgba(255,255,255,0.22); }
  .rb .glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000; }
  .rb.empty .plate { background: rgba(20,23,31,0.55); }
  .rb.empty .rim { box-shadow: inset 0 0 0 calc(var(--s) * 0.06) rgba(255,255,255,0.12); }
  .rb.empty .glyph { color: var(--muted); }
  .rb .glow { position: absolute; inset: -25%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,209,64,0) 45%, rgba(255,209,64,0.85) 58%, rgba(255,209,64,0) 72%); }
  .rb .cd { position: absolute; inset: 7%; border-radius: 50%; }
  .rb .cdnum { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .rb .ripple { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.9); }
  .rb .flash { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,0.18); }
  .rb .slotnum { position: absolute; top: 2px; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 800;
    color: var(--gold); text-shadow: 0 0 2px #000, 0 0 2px #000; }
  .rb .under { position: absolute; top: 100%; left: -30px; right: -30px; text-align: center; margin-top: 4px;
    font-size: 12px; color: var(--muted); text-shadow: 0 1px 2px #000; }
  .dots { position: absolute; left: 0; right: 0; top: 100%; display: flex; justify-content: center; gap: 3px; margin-top: 2px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.35); }
  .dots i.on { background: var(--accent); }

  /* panels, mirror Widgets.lua Panel */
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line); box-sizing: border-box;
    transform-origin: center center; }
  .panel::before { content: ""; position: absolute; top: -1px; left: -1px; right: -1px; height: 3px; background: var(--accent); }
  .panel h1 { position: absolute; left: 22px; top: 18px; margin: 0; font-size: 20px; font-weight: 600; }
  .panel .sub { position: absolute; left: 22px; top: 46px; font-size: 13px; color: var(--muted); }
  .btn { position: absolute; background: var(--panel-light); display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: var(--text); }
  .btn.primary, .btn.sel { background: var(--accent); }
  .tile { position: absolute; width: 104px; height: 104px; background: var(--panel-light); }
  .tile .ti { position: absolute; left: 27px; top: 14px; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; }
  .tile .tl { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 13px; }
  .tile.press { background: #343846; }
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
  .cell { position: absolute; width: 88px; height: 84px; }
  .cell .ci { position: absolute; left: 19px; top: 4px; width: 50px; height: 50px; border-radius: 4px; overflow: hidden; }
  .cell .cn { position: absolute; left: -2px; right: -2px; top: 58px; text-align: center; font-size: 11px; line-height: 1.2; }
  .toggle { position: absolute; width: 58px; height: 32px; border-radius: 16px; background: #40424f; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { left: 29px; }
  .outline { position: absolute; border: 2px solid rgba(219,39,119,0.7); background: rgba(219,39,119,0.06); box-sizing: border-box; }
  .outline.sel { background: rgba(219,39,119,0.13); }
  .handle-label { position: absolute; font-size: 12px; text-align: center; width: 160px; text-shadow: 0 1px 2px #000; }

  .stick { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.10); border: 2px solid rgba(255,255,255,0.35); }
  .stick .nub { position: absolute; width: 40%; height: 40%; left: 30%; top: 30%; border-radius: 50%;
    background: rgba(255,255,255,0.45); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
  .padbtn { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.4);
    display: flex; align-items: center; justify-content: center; font-weight: 800; color: rgba(255,255,255,0.85); }
  .tag { position: absolute; font-size: 11px; color: rgba(255,255,255,0.55); letter-spacing: 0.02em; }
  .finger { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    background: rgba(255,255,255,0.35); border: 2px solid rgba(255,255,255,0.8); box-shadow: 0 0 12px rgba(255,255,255,0.5); }
  .callout { position: absolute; padding: 6px 10px; border-radius: 6px; background: rgba(10,12,18,0.85); border: 1px solid rgba(219,39,119,0.8);
    font-size: 14px; white-space: nowrap; }
</style>
<script src="layout.js"></script>
</head>
<body>
<div id="screen"></div>
<script>
const params = new URLSearchParams(location.search);
const scene = params.get("scene") || "hud-cover";
const T = parseFloat(params.get("t") || "0");

// ---------------------------------------------------------------- icons ----
// Original stand-in icons (no game art): gradient badge + simple glyph.
const ICONS = {

  charge:   ["#2f8f6b", "#0b2c20", '<path d="M14 50 L60 50 M44 30 L66 50 L44 70" stroke="#e9fff6" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 30 L84 50 L60 70" stroke="#9ff0cf" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'],

  food:     ["#9c5d22", "#36200a", '<circle cx="50" cy="56" r="26" fill="#f0c27a"/><path d="M50 30 C54 20 62 16 70 18 C64 24 58 28 50 30 Z" fill="#7fc24a"/>'],
  fire:     ["#c2410c", "#3b0d02", '<path d="M50 12 C62 32 78 40 74 64 A24 24 0 0 1 26 64 C24 50 34 44 38 32 C42 42 46 44 50 40 C50 30 48 22 50 12 Z" fill="#ffb347"/><path d="M50 50 C56 58 62 62 60 72 A10 10 0 0 1 40 72 C40 64 46 60 50 50 Z" fill="#fff1a8"/>'],
  target:   ["#8f1d3a", "#2a0711", '<circle cx="50" cy="50" r="30" stroke="#ffe3ea" stroke-width="6" fill="none"/><circle cx="50" cy="50" r="14" stroke="#ffe3ea" stroke-width="6" fill="none"/><circle cx="50" cy="50" r="4" fill="#ffe3ea"/>'],

  book:     ["#2d4f9e", "#0c1736", '<path d="M18 24 L48 30 L48 82 L18 76 Z M82 24 L52 30 L52 82 L82 76 Z" fill="#eef2ff"/>'],

  map:      ["#3f7a6a", "#0f2620", '<path d="M14 26 L36 18 L64 28 L86 20 L86 74 L64 82 L36 72 L14 80 Z" fill="#e8f5e8"/><path d="M36 18 L36 72 M64 28 L64 82" stroke="#3f7a6a" stroke-width="3"/>'],
  social:   ["#9a3c7a", "#2e0b24", '<circle cx="36" cy="38" r="12" fill="#ffe6f6"/><circle cx="64" cy="38" r="12" fill="#ffe6f6"/><path d="M14 80 C14 58 58 58 58 80 Z M42 80 C42 58 86 58 86 80 Z" fill="#ffe6f6"/>'],

  wrench:   ["#6c6f80", "#1e2028", '<path d="M70 14 A18 18 0 0 0 56 40 L18 78 L24 84 L62 46 A18 18 0 0 0 88 32 L78 40 L66 36 L62 24 Z" fill="#eef0f6"/>'],
  gear:     ["#4b5468", "#151821", '<circle cx="50" cy="50" r="22" fill="none" stroke="#eef0f6" stroke-width="12" stroke-dasharray="9 6"/><circle cx="50" cy="50" r="10" fill="#eef0f6"/>'],
  menu:     ["#5a5f6e", "#191b22", '<circle cx="50" cy="50" r="30" fill="none" stroke="#eef0f6" stroke-width="7"/><path d="M50 36 V54" stroke="#eef0f6" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="66" r="4.5" fill="#eef0f6"/>'],
  character:["#8a5a2b", "#2b1a0b", '<circle cx="50" cy="32" r="14" fill="#ffeedd"/><path d="M22 86 C22 54 78 54 78 86 Z" fill="#ffeedd"/>'],
  macro:    ["#4a4f63", "#15171f", '<text x="50" y="64" font-size="42" text-anchor="middle" fill="#eef0f6" font-family="monospace" font-weight="700">?</text>'],
};
function iconSVG(key, tint) {
  const d = ICONS[key];
  if (!d) return "";
  const id = "g" + Math.random().toString(36).slice(2, 8);
  let filter = "";
  if (tint === "red") filter = '<rect width="100" height="100" fill="#ff2020" opacity="0.45"/>';
  if (tint === "blue") filter = '<rect width="100" height="100" fill="#3050ff" opacity="0.4"/>';
  if (tint === "grey") filter = '<rect width="100" height="100" fill="#000" opacity="0.5"/>';
  return `<svg viewBox="0 0 100 100"><defs><radialGradient id="${id}" cx="35%" cy="30%" r="80%">
    <stop offset="0" stop-color="${d[0]}"/><stop offset="1" stop-color="${d[1]}"/></radialGradient></defs>
    <rect width="100" height="100" fill="url(#${id})"/>${d[2]}${filter}</svg>`;
}

// ---------------------------------------------------------------- world ----
function world(W, H, opts = {}) {
  const horizon = H * 0.52;
  const hills = (seed, y, amp, color) => {
    let pts = `0,${H} `;
    for (let i = 0; i <= 24; i++) {
      const x = (W / 24) * i;
      const yy = y - amp * (0.5 + 0.5 * Math.sin(i * 0.9 + seed) * Math.cos(i * 0.37 + seed * 2));
      pts += `${x.toFixed(0)},${yy.toFixed(0)} `;
    }
    return `<polygon points="${pts}${W},${H}" fill="${color}"/>`;
  };
  const trees = [];
  for (let i = 0; i < 22; i++) {
    const x = ((i * 137) % 100) / 100 * W;
    const s = 0.6 + ((i * 53) % 10) / 14;
    const y = horizon + 18 + ((i * 29) % 40);
    trees.push(`<g transform="translate(${x.toFixed(0)},${y.toFixed(0)}) scale(${s.toFixed(2)})">
      <rect x="-3" y="0" width="6" height="18" fill="#2a1d14"/><polygon points="0,-46 -20,4 20,4" fill="#173a2a"/><polygon points="0,-62 -14,-24 14,-24" fill="#1d4a33"/></g>`);
  }
  const cx = W * (opts.heroX || 0.47), gy = H * 0.74;
  return `<svg class="world" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" width="${W}" height="${H}">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a4a"/><stop offset="0.6" stop-color="#d9825b"/><stop offset="1" stop-color="#f2b36d"/></linearGradient>
      <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d5a2a"/><stop offset="1" stop-color="#1c2b13"/></linearGradient>
      <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff2c4"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="${W}" height="${horizon + 30}" fill="url(#sky)"/>
    <circle cx="${W * 0.66}" cy="${horizon - 40}" r="${H * 0.22}" fill="url(#sun)"/>
    ${hills(1, horizon, 70, "#5c4a6e")}${hills(4, horizon + 22, 50, "#3b3a55")}
    <rect y="${horizon + 20}" width="${W}" height="${H - horizon}" fill="url(#ground)"/>
    <path d="M${W * 0.40} ${H} C ${W * 0.46} ${H * 0.8}, ${W * 0.5} ${H * 0.68}, ${W * 0.56} ${horizon + 22} L ${W * 0.6} ${horizon + 22} C ${W * 0.58} ${H * 0.68}, ${W * 0.62} ${H * 0.8}, ${W * 0.72} ${H} Z" fill="#7a6a48" opacity="0.6"/>
    ${trees.join("")}
    <!-- stand-in hero (back view) -->
    <g transform="translate(${cx},${gy})">
      <ellipse cx="0" cy="62" rx="34" ry="8" fill="#000" opacity="0.35"/>
      <rect x="-15" y="18" width="11" height="44" rx="4" fill="#3a2a22"/><rect x="4" y="18" width="11" height="44" rx="4" fill="#3a2a22"/>
      <path d="M-24 -30 L24 -30 L20 24 L-20 24 Z" fill="#6b2a2a"/><path d="M-30 -32 L30 -32 L24 -16 L-24 -16 Z" fill="#9aa3b5"/>
      <circle cx="0" cy="-44" r="15" fill="#c79a6b"/><path d="M-15 -48 A15 15 0 0 1 15 -48 L15 -42 L-15 -42 Z" fill="#9aa3b5"/>
      <path d="M26 -26 L34 -26 L40 30 L32 30 Z" fill="#7a6a58"/><path d="M30 -70 L36 -70 L36 -26 L30 -26 Z" fill="#d8dde8"/>
    </g>
    <!-- stand-in enemy -->
    <g transform="translate(${W * 0.6},${H * 0.6}) scale(0.8)">
      <ellipse cx="0" cy="40" rx="40" ry="7" fill="#000" opacity="0.35"/>
      <path d="M-34 36 C-40 0 -20 -20 0 -20 C24 -20 44 0 38 36 Z" fill="#4b3a2e"/>
      <path d="M20 -16 C34 -30 52 -24 52 -8 L36 4 Z" fill="#4b3a2e"/><circle cx="44" cy="-12" r="3" fill="#ff4040"/>
      <path d="M48 -24 L58 -36 L54 -20 Z" fill="#d8cfc0"/>
    </g>
    <g transform="translate(${W * 0.6 - 60},${H * 0.6 - 60})">
      <text x="60" y="-4" font-size="13" text-anchor="middle" fill="#ff6060" font-family="sans-serif" font-weight="700" stroke="#000" stroke-width="3" paint-order="stroke">Ridge Prowler</text>
      <rect x="0" y="2" width="120" height="9" fill="#000" opacity="0.7"/><rect x="1" y="3" width="${opts.enemyHp ?? 82}" height="7" fill="#d93030"/>
    </g>
  </svg>`;
}

// Generic stand-in unit frames (not the game's art).
function unitFrames(W) {
  const frame = (x, name, lvl, hp, pw, pwColor) => `
    <div class="abs" style="left:${x}px;top:16px;width:210px;height:58px;background:rgba(10,12,18,0.72);border:1px solid rgba(255,255,255,0.15);border-radius:8px;">
      <div class="abs" style="left:8px;top:7px;width:44px;height:44px;border-radius:50%;background:#2a2d3a;border:2px solid #c9a24a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;">${lvl}</div>
      <div class="abs" style="left:60px;top:7px;font-size:13px;font-weight:600;">${name}</div>
      <div class="abs" style="left:60px;top:27px;width:140px;height:10px;background:#000"><div style="width:${hp}%;height:100%;background:#2fbf4a"></div></div>
      <div class="abs" style="left:60px;top:40px;width:140px;height:7px;background:#000"><div style="width:${pw}%;height:100%;background:${pwColor}"></div></div>
    </div>`;
  return frame(16, "Thorne", 24, 88, 46, "#c83a3a") + frame(240, "Ridge Prowler", 22, 82, 0, "#000");
}

// ----------------------------------------------------------- controls ----
function roundButton(it, H, o = {}) {
  const s = it.w;
  const left = it.x, top = H - it.y - it.h;
  const empty = o.empty;
  let inner = `<div class="shadow"></div><div class="plate"></div>`;
  if (o.glow) inner = `<div class="glow"></div>` + inner;
  if (!empty && o.icon) inner += `<div class="icon">${iconSVG(o.icon, o.tint)}</div>`;
  if (o.cd != null) {
    const deg = (1 - o.cd) * 360;
    inner += `<div class="cd" style="background:conic-gradient(rgba(0,0,0,0) 0deg ${deg}deg, rgba(0,0,0,0.72) ${deg}deg 360deg)"></div>`;
    if (o.cdText) inner += `<div class="cdnum" style="font-size:${Math.round(s * 0.3)}px">${o.cdText}</div>`;
  }
  inner += `<div class="rim" style="${o.rim ? `box-shadow: inset 0 0 0 ${s * 0.075}px ${o.rim}` : ""}"></div>`;
  if (o.plateColor) inner = inner.replace('<div class="plate"></div>', `<div class="plate" style="background:${o.plateColor}"></div>`);
  if (o.glyph) inner += `<div class="glyph" style="font-size:${o.glyphSize || Math.round(s * 0.36)}px">${o.glyph}</div>`;
  if (o.flash) inner += `<div class="flash"></div>`;
  if (o.ripple != null) {
    const k = 1 + 0.45 * o.ripple, a = 0.9 * (1 - o.ripple);
    inner += `<div class="ripple" style="transform:scale(${k});opacity:${a}"></div>`;
  }
  if (o.slotnum) inner += `<div class="slotnum">${o.slotnum}</div>`;
  if (o.under) inner += `<div class="under">${o.under}</div>`;
  if (o.dots) inner += `<div class="dots">${o.dots}</div>`;
  if (o.count) inner += `<div class="cdnum" style="align-items:flex-end;padding-bottom:${s * 0.1}px;font-size:${Math.max(12, s * 0.2)}px">${o.count}</div>`;
  return `<div class="rb${empty ? " empty" : ""}" style="--s:${s}px;left:${left}px;top:${top}px;width:${s}px;height:${s}px;opacity:${o.alpha ?? 1}">${inner}</div>`;
}

function hud(L, st = {}) {
  const H = L.height;
  let html = "";
  const page = st.page || 1;
  for (const it of L.items) {
    if (it.kind === "action") {
      let icon = it.icon;
      if (page === 2) icon = it.index === 1 ? "fire" : (it.index === 2 ? "shield" : "");
      const o = { icon, empty: !icon, glyph: icon ? "" : "+", alpha: icon ? 1 : 0.75 };
      Object.assign(o, (st.buttons || {})[it.index] || {});
      if (st.edit) { o.rim = "rgba(219,39,119,0.9)"; o.slotnum = it.index; o.alpha = 1; }
      html += roundButton(it, H, o);
    } else if (it.kind === "pill") {
      const dots = [1, 2].map(i => `<i class="${i === page ? "on" : ""}"></i>`).join("");
      html += roundButton(it, H, { glyph: String(page), glyphSize: 16, plateColor: "rgba(120,21,67,0.95)", dots, ...(st.pill || {}) });
    } else if (it.kind === "utility") {
      const o = it.label === "Clear" ? { glyph: "X" } : { icon: it.icon };
      html += roundButton(it, H, { ...o, under: it.label, ...((st.utility || {})[it.label] || {}) });
    } else if (it.kind === "zoom") {
      html += roundButton(it, H, { glyph: it.text === "-" ? "&minus;" : "+", glyphSize: 24 });
    } else if (it.kind === "menu") {
      const bars = `<div class="glyph" style="flex-direction:column;gap:5px">${'<i style="display:block;width:24px;height:3px;background:#fff"></i>'.repeat(3)}</div>`;
      html += roundButton(it, H, { plateColor: "rgba(131,25,72,0.95)", ...(st.menu || {}) }).replace(/<\/div>$/, bars + "</div>");
    }
  }
  return html;
}

function stick(L, opts = {}) {
  // DroidDeck on-screen stick + A, placed on the addon's stick guide.
  const W = L.width, H = L.height, left = L.handed !== "left";
  const cx = (left ? 0.13 : 0.87) * W, cy = H - H * 0.27, r = 92;
  const nx = (opts.nx || 0) * r * 0.5, ny = (opts.ny || 0) * r * 0.5;
  const ax = cx + (left ? 1 : -1) * 150, ay = cy - 105;
  return `<div class="stick" style="left:${cx - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px">
      <div class="nub" style="transform:translate(${nx}px,${ny}px)"></div></div>
    <div class="padbtn" style="left:${ax - 30}px;top:${ay - 30}px;width:60px;height:60px;font-size:22px">A</div>
    <div class="tag" style="left:${cx - 90}px;top:${cy + r + 8}px;width:180px;text-align:center">DroidDeck on-screen stick</div>`;
}

function stickGuide(L) {
  const W = L.width, H = L.height, left = L.handed !== "left";
  const cx = (left ? 0.13 : 0.87) * W, cy = H - H * 0.27;
  return `<div class="abs" style="left:${cx - 115}px;top:${cy - 115}px;width:230px;height:230px;border-radius:50%;
      background:rgba(219,39,119,0.10);box-shadow:inset 0 0 0 16px rgba(219,39,119,0.85)"></div>
    <div class="abs" style="left:${cx - 40}px;top:${cy - 40}px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.25)"></div>
    <div class="abs" style="left:${cx - 130}px;top:${cy - 145}px;width:260px;text-align:center;font-size:14px;text-shadow:0 1px 2px #000">Put DroidDeck's left stick here</div>`;
}

function fit(w, h, W, H, max) { return Math.min(max, (W * 0.94) / w, (H * 0.92) / h); }

function panelBox(W, H, w, h, max, extraStyle = "") {
  const s = fit(w, h, W, H, max);
  return { s, style: `left:${(W - w) / 2}px;top:${(H - h) / 2}px;width:${w}px;height:${h}px;transform:scale(${s});${extraStyle}` };
}

// ------------------------------------------------------------- panels ----
const TILES = [["Character", "character"], ["Bags", "bags"], ["Spellbook", "book"], ["Talents", "talents"],
  ["Quests", "quest"], ["Map", "map"], ["Social", "social"], ["Chat", "chat"],
  ["Close windows", "close"], ["Edit layout", "wrench"], ["Touch settings", "gear"], ["Game menu", "menu"]];

function menuPanel(W, H, o = {}) {
  const w = 4 * 104 + 3 * 12 + 48, h = 3 * 104 + 2 * 12 + 96;
  const b = panelBox(W, H, w, h, 1.2, `opacity:${o.alpha ?? 1}`);
  let tiles = "";
  TILES.forEach(([label, icon], i) => {
    const col = i % 4, row = Math.floor(i / 4);
    tiles += `<div class="tile${o.press === i ? " press" : ""}" style="left:${24 + col * 116}px;top:${72 + row * 116}px">
      <div class="ti">${iconSVG(icon)}</div><div class="tl">${label}</div></div>`;
  });
  return `<div class="dim" style="opacity:${o.alpha ?? 1}"></div><div class="panel" style="${b.style}"><h1>Menu</h1>
    <div class="btn" style="right:10px;top:10px;width:44px;height:44px">X</div>${tiles}</div>`;
}

function pickerPanel(W, H) {
  const w = 6 * 96 + 48, h = 3 * 92 + 214;
  const b = panelBox(W, H, w, h, 1.2);
  const tabs = ["General", "Arms", "Fury", "Protection", "Items", "Macros"];
  const bw = Math.min(150, (w - 40 - 6 * 5) / 6);
  let html = `<div class="panel" style="${b.style}"><h1>Choose an action for button 3</h1>
    <div class="sub">Tap a spell, item or macro. It goes on action slot 3.</div>
    <div class="btn" style="right:10px;top:10px;width:44px;height:44px">X</div>`;
  tabs.forEach((t, i) => { html += `<div class="btn${i === 1 ? " sel" : ""}" style="left:${20 + i * (bw + 6)}px;top:74px;width:${bw}px;height:40px;font-size:14px">${t}</div>`; });
  const spells = [["Heroic Strike", "strike"], ["Rend", "rend"], ["Charge", "charge"], ["Thunder Clap", "thunder"],
    ["Hamstring", "hamstring"], ["Battle Shout", "shout"], ["Overpower", "sword"], ["Mocking Blow", "assist"],
    ["Retaliation", "shield"], ["Mortal Strike", "fire"]];
  spells.forEach(([n, ic], i) => {
    const col = i % 6, row = Math.floor(i / 6);
    html += `<div class="cell" style="left:${24 + col * 96}px;top:${124 + row * 92}px${i === 1 ? ";background:rgba(219,39,119,0.35)" : ""}">
      <div class="ci">${iconSVG(ic)}</div><div class="cn">${n}</div></div>`;
  });
  html += `<div class="btn" style="left:20px;bottom:20px;width:60px;height:44px">&lt;</div>
    <div class="btn" style="left:88px;bottom:20px;width:60px;height:44px">&gt;</div>
    <div class="abs" style="left:160px;bottom:34px;font-size:13px;color:var(--muted)">Page 1 / 1</div>
    <div class="btn" style="right:178px;bottom:20px;width:120px;height:44px">Best rank</div>
    <div class="btn" style="right:20px;bottom:20px;width:150px;height:44px">Empty this button</div></div>`;
  return `<div class="dim" style="opacity:0.35"></div>` + html;
}

function editOverlay(L) {
  const H = L.height, W = L.width;
  let html = stickGuide(L);
  for (const it of L.items.filter(i => i.kind === "group")) {
    const top = H - it.y - it.h, sel = it.name === "cluster";
    html += `<div class="outline${sel ? " sel" : ""}" style="left:${it.x}px;top:${top}px;width:${it.w}px;height:${it.h}px"></div>`;
  }
  // handle positions exported from the addon's edit mode
  for (const it of L.items.filter(i => i.kind === "handle")) {
    const sel = it.name === "cluster";
    const hx = it.x + it.w / 2, hy = H - it.y - it.h / 2;
    html += roundButton(it, H, { plateColor: "#db2777", glyph: "&#10021;", glyphSize: 22, alpha: sel ? 1 : 0.8 });
    html += `<div class="handle-label" style="left:${hx - 80}px;top:${hy - it.h / 2 - 20}px">${it.label}</div>`;
  }
  // toolbar
  const w = 820, h = 176, s = Math.min(1, (W * 0.94) / w, (H * 0.92) / h);
  html += `<div class="panel" style="left:${(W - w) / 2}px;top:${12 - (h - h * s) / 2}px;width:${w}px;height:${h}px;transform:scale(${s})">
    <h1>Edit layout</h1><div class="sub">Drag a pink handle to move. Tap any spell button to change it, or drag one button onto another to swap.</div>`;
  ["Spell wheel", "Target buttons", "Menu button", "Camera zoom"].forEach((g, i) => {
    html += `<div class="btn${i === 0 ? " sel" : ""}" style="left:${22 + i * 195.5}px;top:72px;width:189.5px;height:40px">${g}</div>`;
  });
  const stepper = (x, label, val) => `<div class="abs" style="left:${x}px;top:134px;font-size:15px">${label}</div>
    <div class="btn" style="left:${x + 96}px;top:124px;width:44px;height:40px">&minus;</div>
    <div class="abs" style="left:${x + 140}px;top:134px;width:66px;text-align:center;color:var(--gold);font-size:15px">${val}</div>
    <div class="btn" style="left:${x + 206}px;top:124px;width:44px;height:40px">+</div>`;
  html += stepper(22, "Size", "95%") + stepper(302, "Opacity", "100%");
  html += `<div class="btn" style="right:138px;bottom:10px;width:120px;height:44px">Reset layout</div>
    <div class="btn primary" style="right:20px;bottom:10px;width:110px;height:44px">Done</div></div>`;
  return html;
}

function setupPanel(W, H, L) {
  const w = 700, h = 520;
  const b = panelBox(W, H, w, h, 1.2);
  const line = (y, t, muted) => `<div class="abs" style="left:26px;right:26px;top:${y}px;font-size:14px;line-height:1.35;${muted ? "color:var(--muted)" : ""}">${t}</div>`;
  return `<div class="panel" style="${b.style}"><h1>Welcome to Forever Touch</h1>
    <div class="sub" style="color:var(--accent-soft)">Step 2 of 3 - Running and jumping</div>
    <div class="btn" style="right:10px;top:10px;width:44px;height:44px">X</div>
    ${line(86, "Blizzard doesn't let addons move your character, so movement uses WoW's built-in controller support with DroidDeck's on-screen stick. You get smooth analog running, and A jumps.")}
    <div class="btn primary" style="left:26px;top:146px;width:300px;height:48px">Controller movement on</div>
    <div class="abs" style="left:340px;top:162px;font-size:14px;color:#4ddb80">Controller movement is on</div>
    ${line(214, "1.&nbsp; In DroidDeck, swipe in from the right edge and turn on the on-screen controls.")}
    ${line(244, "2.&nbsp; Keep the left stick and the A button. Drag the stick onto the pink circle.")}
    ${line(274, "3.&nbsp; Drag on empty ground with one finger to turn the camera. Pinch or use the + / - buttons to zoom.")}
    ${line(322, "If the stick moves the mouse instead of your character, set this game's Steam Input layout to Gamepad.", true)}
    <div class="abs" style="left:26px;top:364px;font-size:15px">Also allow tap-to-move</div>
    <div class="abs" style="left:26px;top:386px;font-size:12px;color:var(--muted)">Tap the ground to walk there (needs DroidDeck's long-press = right click).</div>
    <div class="toggle" style="right:26px;top:366px"></div>
    <div class="btn" style="left:26px;bottom:20px;width:120px;height:48px">Back</div>
    <div class="btn primary" style="right:26px;bottom:20px;width:160px;height:48px">Next</div>
    <div class="abs" style="left:0;right:0;bottom:34px;display:flex;justify-content:center;gap:8px">
      <i style="width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.3)"></i>
      <i style="width:10px;height:10px;border-radius:50%;background:var(--accent)"></i>
      <i style="width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.3)"></i></div></div>`;
}

// ------------------------------------------------------------- scenes ----
const COMBAT = {
  1: { glow: true },
  3: { cd: 0.35, cdText: "4" },
  4: { cd: 0.8, cdText: "12" },
  6: { tint: "grey" },
  9: { tint: "red" },
  7: { count: "5" },
  8: { count: "12" },
};

function render() {
  const el = document.getElementById("screen");
  let L = window.LAYOUT.cover, html = "";
  const base = (L2, st, extra = "", worldOpts) => {
    document.body.style.width = L2.width + "px";
    el.style.width = L2.width + "px";
    el.style.height = L2.height + "px";
    return world(L2.width, L2.height, worldOpts) + unitFrames(L2.width) + extra + hud(L2, st);
  };
  switch (scene) {
    case "hud-cover": html = base(L, { buttons: COMBAT }, stick(L, { nx: 0.25, ny: -0.8 })); break;
    case "hud-left": L = window.LAYOUT.coverLeft; html = base(L, { buttons: COMBAT }, stick(L, { nx: -0.3, ny: -0.7 }), { heroX: 0.53 }); break;
    case "hud-main": L = window.LAYOUT.main; html = base(L, { buttons: COMBAT }, stick(L, { ny: -0.6 }), { heroX: 0.42 }); break;
    case "menu": html = base(L, {}, stick(L)) + menuPanel(L.width, L.height); break;
    case "picker": html = base(L, { buttons: { 3: { empty: true, icon: "", glyph: "+", alpha: 0.75 } } }, "") + pickerPanel(L.width, L.height); break;
    case "edit": L = window.LAYOUT.coverEdit; html = base(L, { edit: true }, "") + editOverlay(L); break;
    case "setup": html = base(L, {}, stickGuide(L)) + setupPanel(L.width, L.height, L); break;
    case "demo": html = demo(L); break;
  }
  el.innerHTML = html;
}

// Timeline for the README GIF (deterministic in t).
function demo(L) {
  const W = L.width, H = L.height, t = T;
  document.body.style.width = W + "px";
  const el = document.getElementById("screen");
  el.style.width = W + "px"; el.style.height = H + "px";
  const items = L.items;
  const find = (k, idx) => items.find(i => i.kind === k && (idx == null || i.index === idx));
  const center = it => [it.x + it.w / 2, H - it.y - it.h / 2];
  const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const st = { buttons: { 1: { glow: t > 0.6 } }, page: 1 };
  let extra = "", finger = null, callout = null, overlay = "";
  // stick moves the whole time
  const sx = Math.sin(t * 1.3) * 0.5, sy = -0.75 + Math.cos(t * 1.1) * 0.15;

  // 0.0-0.9  tap big button (auto attack on)
  if (t < 0.9) {
    const b = find("action", 1); finger = center(b);
    if (t > 0.25 && t < 0.45) st.buttons[1] = { flash: true };
    if (t >= 0.45) st.buttons[1] = { glow: true, ripple: ease((t - 0.45) / 0.35) };
    callout = [b, "Tap to cast"];
  }
  // 0.9-2.0  Heroic Strike -> cooldown sweep
  const cdStart = 1.25;
  if (t >= 0.9 && t < 2.0) {
    const b = find("action", 2); finger = center(b);
    if (t > 1.05 && t < 1.25) st.buttons[2] = { flash: true };
    callout = [b, "Cooldowns sweep on the button"];
  }
  if (t >= cdStart && t < 5.6) {
    const p = (t - cdStart) / 6;
    st.buttons[2] = Object.assign(st.buttons[2] || {}, { cd: 1 - p, cdText: String(Math.ceil(6 - (t - cdStart))) });
    if (t < cdStart + 0.35) st.buttons[2].ripple = ease((t - cdStart) / 0.35);
  }
  // 2.0-3.4  flip page
  if (t >= 2.0 && t < 3.4) {
    const pill = find("pill"); finger = center(pill);
    if (t > 2.3) st.page = 2;
    if (t > 2.15 && t < 2.3) st.pill = { flash: true };
    callout = [pill, "Tap the number to flip pages"];
  }
  if (t >= 2.3 && t < 3.4) st.page = 2;
  if (st.page === 2) { delete st.buttons[2]; }
  // 3.4-5.6  open menu, tap Bags
  if (t >= 3.4 && t < 3.9) { const m = find("menu"); finger = center(m); callout = [m, "Menu"]; if (t > 3.6) st.menu = { flash: true }; }
  if (t >= 3.75 && t < 5.2) {
    const a = ease((t - 3.75) / 0.18);
    const press = t > 4.55 && t < 4.8 ? 1 : null;
    overlay = menuPanel(W, H, { alpha: t > 4.8 ? 1 - ease((t - 4.8) / 0.2) : a, press });
    if (t > 4.2 && t < 4.85) {
      // finger on the Bags tile
      const w = 4 * 104 + 3 * 12 + 48, h = 3 * 104 + 2 * 12 + 96, s = fit(w, h, W, H, 1.2);
      const px = W / 2 + (24 + 116 + 52 - w / 2) * s, py = H / 2 + (72 + 52 - h / 2) * s;
      finger = [px, py];
    }
  }
  if (t >= 5.0) {
    // bags open (stand-in)
    const a = ease((t - 5.0) / 0.2);
    extra += `<div class="panel" style="right:${W * 0.2}px;top:${H * 0.24}px;width:260px;height:250px;opacity:${a}"><h1 style="font-size:16px">Backpack</h1>
      <div class="abs" style="left:16px;top:52px;display:grid;grid-template-columns:repeat(5,42px);gap:6px">${["food", "potion", "bandage", "hearth", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""].map(k => `<div style="width:42px;height:42px;background:#1a1d26;border:1px solid rgba(255,255,255,0.12);overflow:hidden">${k ? iconSVG(k) : ""}</div>`).join("")}</div></div>`;
  }
  let html = world(W, H, { enemyHp: Math.max(20, 82 - t * 9) }) + unitFrames(W) + stick(L, { nx: sx, ny: sy }) + extra + hud(L, st) + overlay;
  if (callout && !overlay) {
    html += `<div class="callout" style="left:50%;transform:translateX(-50%);top:104px;font-size:22px;padding:10px 18px">${callout[1]}</div>`;
  }
  if (overlay && t > 4.2 && t < 4.85) {
    html += `<div class="callout" style="left:50%;transform:translateX(-50%);bottom:24px;font-size:22px;padding:10px 18px">Every window is one tap away</div>`;
  }
  if (finger) html += `<div class="finger" style="left:${finger[0]}px;top:${finger[1]}px"></div>`;
  html += `<div class="callout" style="left:${0.13 * W - 70}px;top:${H - H * 0.27 - 150}px;border-color:rgba(255,255,255,0.4)">Thumb runs, A jumps</div>`;
  return html;
}

render();
</script>
